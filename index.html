<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SABER MARKETS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#000;color:#d1d4dc;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh}
.pg{flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden}
.pg.on{display:flex}
#wlH{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #1e222d}
#wlS{width:100%;background:#161a23;border:1px solid #2a2e39;color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;outline:none}
#wlL{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #14171f;cursor:pointer}
.ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;color:#fff;flex-shrink:0}
.mid{flex:1;min-width:0}
.sym{font-weight:700;font-size:14px;color:#fff}
.dsc{font-size:11px;color:#787b86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rgt{text-align:right;flex-shrink:0}
.prc{font-weight:700;font-size:14px;color:#fff}
.chg{font-size:11px;margin-top:2px}
.up{color:#089981}.dn{color:#f23645}.nt{color:#787b86}
#cW{flex:1;position:relative;width:100%;min-height:0;touch-action:none;background:#0b0e14}
canvas{display:block;width:100%;height:100%}
#hnt{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#2962ff;color:#fff;padding:5px 12px;border-radius:12px;font-size:11px;display:none;white-space:nowrap;z-index:15}
#repBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#161a23;border:1px solid #2962ff;padding:5px 8px;border-radius:10px;display:none;align-items:center;gap:6px;z-index:16}
#repBar.on{display:flex}
.rb{background:#222631;border:1px solid #2f3441;color:#fff;padding:4px 9px;border-radius:6px;font-size:11px;font-weight:600}
.rb.act{background:#2962ff;border-color:#2962ff}
#bar{display:flex;align-items:center;gap:7px;padding:6px 10px;background:#0b0e14;border-top:1px solid #1e222d;overflow-x:auto;flex-shrink:0}
.pk{display:flex;align-items:center;gap:5px;background:#161a23;padding:5px 9px;border-radius:6px;border:1px solid #2a2e39;flex-shrink:0}
.pk b{color:#fff;font-size:13px}
.pk select{background:none;border:none;color:#d1d4dc;font-size:12px;font-weight:600;outline:none}
.tb{background:none;border:1px solid #222631;color:#d1d4dc;padding:5px 8px;border-radius:6px;font-size:12px;flex-shrink:0}
.tb.on{color:#fff;background:#2962ff;border-color:#2962ff}
#nav{display:flex;justify-content:space-around;padding:7px 0 9px;background:#000;border-top:1px solid #1e222d;flex-shrink:0}
.nv{background:none;border:none;color:#787b86;font-size:11px;font-weight:600}
.nv.on{color:#fff}
.sh{position:absolute;bottom:8px;left:10px;right:10px;background:#161a23;border:1px solid #2a2e39;border-radius:10px;padding:10px;display:none;z-index:20}
.sh.on{display:block}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}
.op{background:#222631;border:1px solid #2f3441;color:#d1d4dc;padding:8px;border-radius:6px;font-size:12px;display:flex;justify-content:space-between}
.op.on{border-color:#2962ff;background:rgba(41,98,255,.25);color:#fff}
@media (orientation:landscape){#nav{display:none}#bar{padding:4px 10px}}
</style>
</head>
<body>
<div id="pgW" class="pg">
  <div id="wlH"><b style="font-size:15px">SABER <span style="color:#2962ff">MARKETS</span></b><span style="font-size:11px;color:#787b86">Daftar Pantau</span></div>
  <div style="padding:8px 12px"><input id="wlS" placeholder="Cari simbol (XAUUSD, BBCA, BTC, EURUSD...)"></div>
  <div id="wlL"></div>
</div>
<div id="pgC" class="pg on">
  <div id="cW">
    <canvas id="cv"></canvas>
    <div id="hnt">Sentuh & tarik di grafik</div>
    <div id="repBar">
      <span style="font-size:10px;color:#38bdf8;font-weight:700">REPLAY</span>
      <button class="rb" id="rStep">Maju 1 Bar</button>
      <button class="rb" id="rPlay">Play</button>
      <button class="rb" id="rExit" style="color:#f23645">Keluar</button>
    </div>
    <div id="shI" class="sh"><b style="font-size:11px;color:#787b86">INDIKATOR</b>
      <div class="gr">
        <button class="op" id="opE20"><span>EMA 20</span><b>OFF</b></button>
        <button class="op" id="opE50"><span>EMA 50</span><b>OFF</b></button>
        <button class="op" id="opM100"><span>MA 100</span><b>OFF</b></button>
        <button class="op" id="opRsi"><span>RSI 14</span><b>OFF</b></button>
      </div>
    </div>
    <div id="shD" class="sh"><b style="font-size:11px;color:#787b86">ALAT GAMBAR</b>
      <div class="gr">
        <button class="op" id="opTr"><span>Trendline</span><b>/</b></button>
        <button class="op" id="opHl"><span>Garis Horizontal</span><b>-</b></button>
        <button class="op" id="opFb"><span>Fibonacci</span><b>F</b></button>
        <button class="op" id="opBx"><span>Kotak Zona</span><b>Box</b></button>
        <button class="op" id="clrD" style="grid-column:span 2;color:#f23645;justify-content:center">Hapus Semua Gambar</button>
      </div>
    </div>
  </div>
  <div id="bar">
    <div class="pk" id="openW"><b id="cSym">XAUUSD</b>
      <select id="tf" onclick="event.stopPropagation()">
        <option value="1">1m</option><option value="5">5m</option><option value="15" selected>15m</option>
        <option value="60">1H</option><option value="240">4H</option><option value="1440">1D</option>
      </select>
    </div>
    <button class="tb" id="bRep">Replay</button>
    <button class="tb" id="bD">Gambar</button>
    <button class="tb" id="bI">Indikator</button>
    <button class="tb" id="bC">Crosshair</button>
    <button class="tb" id="bU">Undo</button>
    <button class="tb on" id="bA">Auto</button>
  </div>
</div>
<div id="nav">
  <button class="nv" id="nW">Daftar Pantau</button>
  <button class="nv on" id="nC">Chart</button>
  <button class="nv" id="nI">Indikator</button>
</div>
<script>
const ITEMS = Array.of(
  {s:'XAUUSD',d:'Emas / Dollar A.S.',c:'USD',bg:'#eab308',tx:'AU',p:3568.35,chg:-69.73,pct:-1.92},
  {s:'USDJPY',d:'Dollar A.S. / Yen Jepang',c:'JPY',bg:'#ef4444',tx:'JP',p:159.04,chg:0.043,pct:0.03},
  {s:'EURUSD',d:'Euro / Dollar A.S.',c:'USD',bg:'#2563eb',tx:'EU',p:1.0542,chg:0.0018,pct:0.17},
  {s:'USDIDR',d:'Dollar A.S. / Rupiah',c:'IDR',bg:'#dc2626',tx:'ID',p:15925,chg:35,pct:0.22},
  {s:'COMPOSITE',d:'Indeks Harga Saham Gabungan',c:'IDR',bg:'#b91c1c',tx:'IDX',p:7241.58,chg:24.15,pct:0.33},
  {s:'BBCA',d:'Bank Central Asia Tbk',c:'IDR',bg:'#1d4ed8',tx:'BCA',p:10150,chg:125,pct:1.25},
  {s:'BBRI',d:'Bank Rakyat Indonesia Tbk',c:'IDR',bg:'#0284c7',tx:'BRI',p:4380,chg:-40,pct:-0.90},
  {s:'BUMI',d:'PT Bumi Resources Tbk',c:'IDR',bg:'#ea580c',tx:'BM',p:129,chg:1,pct:0.78},
  {s:'BUVA',d:'PT Bukit Uluwatu Villa Tbk',c:'IDR',bg:'#0f766e',tx:'BV',p:294,chg:4,pct:1.38},
  {s:'WBSA',d:'PT BSA Logistics Indonesia Tbk',c:'IDR',bg:'#dc2626',tx:'BSA',p:446,chg:0,pct:0.00},
  {s:'SUPA',d:'PT Super Bank Indonesia Tbk',c:'IDR',bg:'#16a34a',tx:'SP',p:342,chg:-4,pct:-1.16},
  {s:'BULL',d:'PT Buana Lintas Lautan Tbk',c:'IDR',bg:'#991b1b',tx:'BL',p:234,chg:-8,pct:-3.31},
  {s:'BTCUSD',d:'Bitcoin / Dollar A.S.',c:'USD',bg:'#f97316',tx:'BTC',p:96450,chg:1240,pct:1.30},
  {s:'ETHUSD',d:'Ethereum / Dollar A.S.',c:'USD',bg:'#6366f1',tx:'ETH',p:3385,chg:-42,pct:-1.22},
  {s:'SOLUSD',d:'Solana / Dollar A.S.',c:'USD',bg:'#8b5cf6',tx:'SOL',p:238.50,chg:6.80,pct:2.93}
);

let cur = ITEMS.at(0);
let fullData = Array.of();
let drw = Array.of();
let ind = {e20:0, e50:0, m100:0, rsi:0};
let crOn = 0, tool = null, tmp = null, crI = -1, tmr = null;
let vC = 55, rO = -10, vS = 1, vP = 0;
let repPick = 0, repIdx = -1, repTmr = null;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const hnt = document.getElementById('hnt');

function getActData() {
  return repIdx > 0 ? fullData.slice(0, repIdx) : fullData;
}

function fmt(v, c) {
  if (c === 'IDR') return v.toLocaleString('id-ID', {maximumFractionDigits: 2});
  if (v < 10) return v.toFixed(4);
  return v.toLocaleString('id-ID', {minimumFractionDigits: 2, maximumFractionDigits: 3});
}

function renderWL(q) {
  const query = (q || '').toUpperCase();
  const list = document.getElementById('wlL');
  list.innerHTML = '';
  ITEMS.forEach(function(it) {
    if (query && !it.s.includes(query) && !it.d.toUpperCase().includes(query)) return;
    const cls = it.chg > 0 ? 'up' : (it.chg < 0 ? 'dn' : 'nt');
    const sg = it.chg > 0 ? '+' : '';
    const el = document.createElement('div');
    el.className = 'row';
    el.innerHTML = '<div class="ico" style="background:' + it.bg + '">' + it.tx + '</div>' +
      '<div class="mid"><div class="sym">' + it.s + '</div><div class="dsc">' + it.d + '</div></div>' +
      '<div class="rgt"><div class="prc">' + fmt(it.p, it.c) + '</div><div class="chg ' + cls + '">' + sg + fmt(it.chg, it.c) + ' ' + sg + it.pct.toFixed(2) + '%</div></div>';
    el.onclick = function() {
      cur = it;
      document.getElementById('cSym').innerText = it.s;
      go('c');
      init();
    };
    list.appendChild(el);
  });
}

function go(p) {
  document.getElementById('pgW').classList.toggle('on', p === 'w');
  document.getElementById('pgC').classList.toggle('on', p === 'c');
  document.getElementById('nW').classList.toggle('on', p === 'w');
  document.getElementById('nC').classList.toggle('on', p === 'c');
  if (p === 'c') setTimeout(draw, 50);
}

function cdwn(m) {
  if (repIdx > 0) return 'REPLAY';
  const d = new Date(), s = d.getSeconds(), mn = d.getMinutes(), h = d.getHours();
  if (m >= 1440) return String(23 - h).padStart(2, '0') + ':' + String(59 - mn).padStart(2, '0');
  const l = Math.max(1, m * 60 - (((h * 60 + mn) % m) * 60 + s));
  return String(Math.floor(l / 60)).padStart(2, '0') + ':' + String(l % 60).padStart(2, '0');
}

function ema(a, p) {
  const o = Array.of();
  let e = a.at(0).c;
  const k = 2 / (p + 1);
  a.forEach(function(x) {
    e = x.c * k + e * (1 - k);
    o.push(e);
  });
  return o;
}

function sma(a, p) {
  return a.map(function(_, i) {
    const s = a.slice(Math.max(0, i - p + 1), i + 1);
    return s.reduce(function(x, y) { return x + y.c; }, 0) / s.length;
  });
}

function rsi(a, p) {
  return a.map(function(_, i) {
    if (i < p) return 50;
    let u = 0, d = 0;
    for (let j = i - p + 1; j <= i; j++) {
      const f = a.at(j).c - a.at(j - 1).c;
      if (f >= 0) u += f; else d -= f;
    }
    return 100 - 100 / (1 + (d === 0 ? 100 : u / d));
  });
}
function draw() {
  const data = getActData();
  const dpr = window.devicePixelRatio || 1;
  const rc = cv.parentElement.getBoundingClientRect();
  if (!rc.width || !rc.height) return;
  cv.width = rc.width * dpr;
  cv.height = rc.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rc.width, h = rc.height;
  ctx.fillStyle = '#0b0e14';
  ctx.fillRect(0, 0, w, h);
  if (!data.length) return;

  const rP = 72, bP = 20, tP = 24;
  const rH = ind.rsi ? Math.floor(h * 0.22) : 0;
  const cW = w - rP, cH = h - bP - tP - rH;
  rO = Math.min(Math.max(0, data.length - 5), Math.max(-Math.floor(vC * 0.75), Math.round(rO)));
  const end = data.length - rO, st = end - vC;

  let mn = Infinity, mx = -Infinity;
  for (let i = Math.max(0, st); i < Math.min(data.length, end); i++) {
    const c = data.at(i);
    if (c.l < mn) mn = c.l;
    if (c.h > mx) mx = c.h;
  }
  if (!isFinite(mn)) {
    const l = data.at(-1);
    mn = l.l; mx = l.h;
  }

  const mid = (mx + mn) / 2, hf = ((mx - mn) || 1) / 2;
  const sH = (hf * 1.15) / vS, cen = mid + vP * hf;
  const top = cen + sH, bot = cen - sH, rng = (top - bot) || 1;

  const toY = function(p) { return tP + ((top - p) / rng) * cH; };
  const toP = function(y) { return top - ((y - tP) / cH) * rng; };
  const sX = cW / vC;
  const i2x = function(i) { return (i - st) * sX + sX / 2; };
  const x2i = function(x) { return Math.round(st + (x - sX / 2) / sX); };

  ctx.strokeStyle = '#151922';
  ctx.lineWidth = 1;
  ctx.fillStyle = '#787b86';
  ctx.font = '10px sans-serif';
  for (let i = 0; i <= 6; i++) {
    const v = bot + (rng * i) / 6, y = toY(v);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cW, y); ctx.stroke();
    ctx.fillText(fmt(v, cur.c), cW + 6, y + 3);
  }

  ctx.strokeStyle = '#1e222d';
  ctx.beginPath(); ctx.moveTo(cW, 0); ctx.lineTo(cW, h); ctx.moveTo(0, h - bP); ctx.lineTo(w, h - bP); ctx.stroke();
  ctx.fillStyle = '#868993';
  ctx.font = 'bold 10px sans-serif';
  ctx.fillText(cur.c, cW + 14, 15);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, tP, cW, cH); ctx.clip();
  const bW = Math.max(2, sX * 0.64);
  for (let i = Math.max(0, st); i < Math.min(data.length, end); i++) {
    const c = data.at(i), x = i2x(i);
    const col = c.c >= c.o ? '#089981' : '#f23645';
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(x, toY(c.h)); ctx.lineTo(x, toY(c.l)); ctx.stroke();
    const yO = toY(c.o), yC = toY(c.c);
    ctx.fillRect(x - bW / 2, Math.min(yO, yC), bW, Math.max(2, Math.abs(yC - yO)));
  }

  function ln(ar, cl) {
    ctx.strokeStyle = cl; ctx.lineWidth = 1.4; ctx.beginPath();
    let s = 0;
    for (let i = Math.max(0, st); i < Math.min(data.length, end); i++) {
      const x = i2x(i), y = toY(ar.at(i));
      if (!s) { ctx.moveTo(x, y); s = 1; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  if (ind.e20) ln(ema(data, 20), '#2962ff');
  if (ind.e50) ln(ema(data, 50), '#f59e0b');
  if (ind.m100) ln(sma(data, 100), '#ec4899');

  const allD = tmp ? drw.concat(tmp) : drw;
  allD.forEach(function(d) {
    const x1 = i2x(d.i1), y1 = toY(d.p1), x2 = i2x(d.i2), y2 = toY(d.p2);
    if (d.t === 'hline') {
      ctx.strokeStyle = '#f59e0b'; ctx.beginPath(); ctx.moveTo(0, y1); ctx.lineTo(cW, y1); ctx.stroke();
    } else if (d.t === 'trend') {
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    } else if (d.t === 'box') {
      ctx.fillStyle = 'rgba(41,98,255,.2)'; ctx.strokeStyle = '#2962ff';
      ctx.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
      ctx.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
    } else if (d.t === 'fib') {
      Array.of(0, 0.382, 0.5, 0.618, 1).forEach(function(lv) {
        const pr = d.p1 + (d.p2 - d.p1) * lv, yy = toY(pr);
        ctx.strokeStyle = '#2962ff'; ctx.beginPath(); ctx.moveTo(Math.min(x1, x2), yy); ctx.lineTo(Math.max(x1, x2) + 40, yy); ctx.stroke();
        ctx.fillStyle = '#38bdf8'; ctx.fillText((lv * 100).toFixed(1) + '%', Math.min(x1, x2) + 4, yy - 2);
      });
    }
  });

  const lst = data.at(-1), lY = toY(lst.c), lC = lst.c >= lst.o ? '#089981' : '#f23645';
  ctx.strokeStyle = lC; ctx.beginPath(); ctx.moveTo(0, lY); ctx.lineTo(cW, lY); ctx.stroke();
  ctx.restore();

  if (lY >= tP && lY <= tP + cH) {
    ctx.fillStyle = lC; ctx.fillRect(cW + 2, lY - 14, rP - 4, 28);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.fillText(fmt(lst.c, cur.c), cW + 6, lY - 2);
    ctx.font = '9px sans-serif'; ctx.fillText(cdwn(Number(document.getElementById('tf').value)), cW + 6, lY + 10);
  }

  if (ind.rsi) {
    const rT = tP + cH + 6, rB = rH - 8, rs = rsi(data, 14);
    ctx.strokeStyle = '#a855f7'; ctx.beginPath();
    let s = 0;
    for (let i = Math.max(0, st); i < Math.min(data.length, end); i++) {
      const x = i2x(i), y = rT + ((100 - rs.at(i)) / 100) * rB;
      if (!s) { ctx.moveTo(x, y); s = 1; } else ctx.lineTo(x, y);
    }
    ctx.stroke(); ctx.fillStyle = '#a855f7'; ctx.fillText('RSI ' + Math.round(rs.at(-1)), cW + 6, rT + rB / 2);
  }

  if (crOn && crI >= 0 && crI < data.length) {
    const cc = data.at(crI), cx = i2x(crI), cy = toY(cc.c);
    ctx.strokeStyle = 'rgba(255,255,255,.4)';
    ctx.beginPath(); ctx.moveTo(cx, tP); ctx.lineTo(cx, h - bP); ctx.moveTo(0, cy); ctx.lineTo(cW, cy); ctx.stroke();
    ctx.fillStyle = '#161a23'; ctx.fillRect(8, 8, 220, 18); ctx.fillStyle = '#fff';
    ctx.fillText('O:' + fmt(cc.o, cur.c) + ' H:' + fmt(cc.h, cur.c) + ' L:' + fmt(cc.l, cur.c) + ' C:' + fmt(cc.c, cur.c), 12, 20);
  }
  cv._w = cW; cv._p = toP; cv._i = x2i;
}
function stopRep() {
  if (repTmr) { clearInterval(repTmr); repTmr = null; }
  document.getElementById('rPlay').innerText = 'Play';
  document.getElementById('rPlay').classList.remove('act');
}

function init() {
  stopRep(); repPick = 0; repIdx = -1;
  document.getElementById('repBar').classList.remove('on');
  document.getElementById('bRep').classList.remove('on');
  hnt.style.display = 'none';
  if (tmr) clearInterval(tmr);
  drw = Array.of(); tmp = null; crI = -1; rO = -10; vS = 1; vP = 0;
  document.getElementById('bA').classList.add('on');

  const anc = cur.p;
  const m = parseInt(document.getElementById('tf').value, 10) || 15;
  const vol = anc * (0.0005 * Math.sqrt(Math.min(m, 240)));
  let c0 = anc * (1 - 0.006 * Math.cos(m)), bi = 0;
  fullData = Array.of();
  for (let i = 0; i < 240; i++) {
    if (i % 14 === 0) bi = (Math.random() - 0.48) * vol * 0.85;
    const mv = bi + ((anc - c0) / (240 - i)) * 0.25 + (Math.random() - 0.5) * vol * 1.4;
    const o = c0, c = i === 239 ? anc : o + mv, bd = Math.abs(c - o);
    fullData.push({o: o, h: Math.max(o, c) + bd * (0.2 + Math.random() * 0.5) + vol * 0.12, l: Math.min(o, c) - bd * (0.2 + Math.random() * 0.5) - vol * 0.12, c: c});
    c0 = c;
  }
  draw();
  tmr = setInterval(function() {
    if (repIdx > 0) return;
    const l = fullData.at(-1);
    l.c += (Math.random() - 0.495) * l.c * 0.0003;
    if (l.c > l.h) l.h = l.c;
    if (l.c < l.l) l.l = l.c;
    draw();
  }, 1000);
}

let dg = 0, md = 'p', sX = 0, sY = 0, sO = 0, sV = 1, sP = 0, pD = 0, pC = 55;
cv.addEventListener('touchstart', function(e) {
  document.getElementById('shI').classList.remove('on');
  document.getElementById('shD').classList.remove('on');
  const data = getActData(), rc = cv.getBoundingClientRect();
  if (e.touches.length === 2) {
    dg = 0;
    pD = Math.hypot(e.touches.item(0).clientX - e.touches.item(1).clientX, e.touches.item(0).clientY - e.touches.item(1).clientY);
    pC = vC;
    return;
  }
  const t = e.touches.item(0), x = t.clientX - rc.left, y = t.clientY - rc.top;
  if (repPick && cv._i) {
    repIdx = Math.min(fullData.length - 2, Math.max(15, cv._i(x) + 1));
    repPick = 0; hnt.style.display = 'none';
    document.getElementById('repBar').classList.add('on');
    rO = -6; draw(); return;
  }
  if (tool && cv._p && cv._i) {
    const i = cv._i(x), pr = cv._p(y);
    if (tool === 'hline') {
      drw.push({t: 'hline', i1: i, p1: pr, i2: i, p2: pr});
      tool = null; hnt.style.display = 'none';
      document.getElementById('bD').classList.remove('on');
      draw(); return;
    }
    tmp = {t: tool, i1: i, p1: pr, i2: i, p2: pr}; draw(); return;
  }
  if (crOn && cv._i) {
    crI = Math.min(data.length - 1, Math.max(0, cv._i(x))); draw(); return;
  }
  dg = 1; sX = x; sY = y; sO = rO; sV = vS; sP = vP;
  md = (cv._w && x > cv._w) ? 'v' : 'p';
}, {passive: false});

cv.addEventListener('touchmove', function(e) {
  e.preventDefault();
  const data = getActData(), rc = cv.getBoundingClientRect();
  if (e.touches.length === 2 && pD > 0) {
    const d = Math.hypot(e.touches.item(0).clientX - e.touches.item(1).clientX, e.touches.item(0).clientY - e.touches.item(1).clientY);
    vC = Math.min(200, Math.max(12, Math.round(pC * (pD / Math.max(10, d)))));
    draw(); return;
  }
  const t = e.touches.item(0), x = t.clientX - rc.left, y = t.clientY - rc.top;
  if (tmp && cv._p && cv._i) { tmp.i2 = cv._i(x); tmp.p2 = cv._p(y); draw(); return; }
  if (crOn && cv._i) { crI = Math.min(data.length - 1, Math.max(0, cv._i(x))); draw(); return; }
  if (!dg) return;
  if (md === 'v') {
    vS = Math.min(4.5, Math.max(0.25, sV * Math.exp(-(y - sY) * 0.008)));
    document.getElementById('bA').classList.remove('on'); draw();
  } else {
    rO = sO + ((x - sX) / ((cv._w || 300) / vC));
    if (!document.getElementById('bA').classList.contains('on')) vP = sP + ((y - sY) / 140) / vS;
    draw();
  }
}, {passive: false});

cv.addEventListener('touchend', function() {
  if (tmp) {
    drw.push(tmp); tmp = null; tool = null; hnt.style.display = 'none';
    document.getElementById('bD').classList.remove('on'); draw();
  }
  dg = 0; pD = 0;
});

document.getElementById('bRep').onclick = function() {
  if (repIdx > 0 || repPick) {
    stopRep(); repPick = 0; repIdx = -1;
    document.getElementById('repBar').classList.remove('on');
    document.getElementById('bRep').classList.remove('on');
    hnt.style.display = 'none'; draw();
  } else {
    repPick = 1; document.getElementById('bRep').classList.add('on');
    hnt.innerText = 'Sentuh candle tempat potong chart'; hnt.style.display = 'block';
  }
};
document.getElementById('rStep').onclick = function() {
  if (repIdx > 0 && repIdx < fullData.length) { repIdx++; draw(); }
  else { stopRep(); repIdx = -1; document.getElementById('repBar').classList.remove('on'); document.getElementById('bRep').classList.remove('on'); draw(); }
};
document.getElementById('rPlay').onclick = function() {
  if (repTmr) { stopRep(); }
  else {
    document.getElementById('rPlay').innerText = 'Pause';
    document.getElementById('rPlay').classList.add('act');
    repTmr = setInterval(function() {
      if (repIdx > 0 && repIdx < fullData.length) { repIdx++; draw(); }
      else { stopRep(); repIdx = -1; document.getElementById('repBar').classList.remove('on'); document.getElementById('bRep').classList.remove('on'); draw(); }
    }, 700);
  }
};
document.getElementById('rExit').onclick = function() {
  stopRep(); repPick = 0; repIdx = -1;
  document.getElementById('repBar').classList.remove('on');
  document.getElementById('bRep').classList.remove('on'); draw();
};

function togInd(k, el) {
  ind[k] = !ind[k]; el.classList.toggle('on', ind[k]);
  el.querySelector('b').innerText = ind[k] ? 'ON' : 'OFF'; draw();
}
document.getElementById('opE20').onclick = function() { togInd('e20', this); };
document.getElementById('opE50').onclick = function() { togInd('e50', this); };
document.getElementById('opM100').onclick = function() { togInd('m100', this); };
document.getElementById('opRsi').onclick = function() { togInd('rsi', this); };

function setTl(t) {
  tool = t; document.getElementById('shD').classList.remove('on');
  document.getElementById('bD').classList.add('on');
  hnt.innerText = 'Sentuh & tarik di grafik'; hnt.style.display = 'block';
}
document.getElementById('opTr').onclick = function() { setTl('trend'); };
document.getElementById('opHl').onclick = function() { setTl('hline'); };
document.getElementById('opFb').onclick = function() { setTl('fib'); };
document.getElementById('opBx').onclick = function() { setTl('box'); };

document.getElementById('nW').onclick = function() { go('w'); };
document.getElementById('nC').onclick = function() { go('c'); };
document.getElementById('nI').onclick = function() { go('c'); document.getElementById('shD').classList.remove('on'); document.getElementById('shI').classList.toggle('on'); };
document.getElementById('openW').onclick = function() { go('w'); };
document.getElementById('wlS').oninput = function(e) { renderWL(e.target.value); };
document.getElementById('bD').onclick = function() { document.getElementById('shI').classList.remove('on'); document.getElementById('shD').classList.toggle('on'); };
document.getElementById('bI').onclick = function() { document.getElementById('shD').classList.remove('on'); document.getElementById('shI').classList.toggle('on'); };
document.getElementById('bC').onclick = function() { crOn = !crOn; this.classList.toggle('on', crOn); if (!crOn) crI = -1; draw(); };
document.getElementById('bU').onclick = function() { drw.pop(); draw(); };
document.getElementById('bA').onclick = function() { vS = 1; vP = 0; rO = -10; this.classList.add('on'); draw(); };
document.getElementById('clrD').onclick = function() { drw = Array.of(); document.getElementById('shD').classList.remove('on'); draw(); };
window.addEventListener('resize', function() { setTimeout(draw, 80); });
document.getElementById('tf').onchange = init;
renderWL('');
init();
</script>
</body>
</html>
