<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SABER MARKETS - Pro Financial Charting</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="authGate">
  <div class="auth-card">
    <div class="auth-logo">SABER <span>MARKETS</span></div>
    <p class="auth-sub">Platform Analisis Charting & Data Pasar Real-Time</p>
    <button id="btnGoogleLogin" class="g-btn">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.5H12v4.8h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 9 0 11.2 0 13.5s.6 4.5 1.6 6.5l3.7-2.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 21.1 7.4 24 12 24z"/></svg>
      <span>Lanjutkan dengan Google</span>
    </button>
    <div id="authErr" class="auth-err"></div>
  </div>
</div>

<div id="appShell" style="display:none">
  <div id="pgW" class="pg">
    <div id="wlH">
      <b style="font-size:15px">SABER <span style="color:#2962ff">MARKETS</span></b>
      <div style="display:flex;align-items:center;gap:10px">
        <span id="userBadge" class="u-badge"></span>
        <button class="srch-btn" id="openSrchTop" title="Cari Simbol">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button id="btnLogout" class="out-btn">Keluar</button>
      </div>
    </div>
    <div id="wlL"></div>
  </div>

  <div id="pgS" class="pg">
    <div id="srTop">
      <button class="srch-btn" id="backSrch">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <input id="srInp" placeholder="Cari simbol atau broker (OANDA, FXCM, XAU, BTC, BBCA...)">
    </div>
    <div id="cats">
      <button class="cat on" data-cat="ALL">Seluruh</button>
      <button class="cat" data-cat="Komoditas">Komoditas</button>
      <button class="cat" data-cat="Kripto">Kripto</button>
      <button class="cat" data-cat="Forex">Forex</button>
      <button class="cat" data-cat="Saham">Saham</button>
      <button class="cat" data-cat="Indeks">Indeks</button>
    </div>
    <div id="srL"></div>
  </div>

  <div id="pgC" class="pg on">
    <div id="cW">
      <canvas id="cv"></canvas>
      <div id="feedStatus" class="feed-tag">Memuat data pasar...</div>
      <div id="hnt">Sentuh & tarik di grafik</div>
      <div id="repBar">
        <span style="font-size:10px;color:#38bdf8;font-weight:700">REPLAY</span>
        <button class="rb" id="rStep">Maju 1 Bar</button>
        <button class="rb" id="rPlay">Play</button>
        <button class="rb" id="rExit" style="color:#f23645">Keluar</button>
      </div>
      <div id="objBar">
        <span id="objLabel">Objek Terpilih</span>
        <button class="rb" id="objColor">Warna</button>
        <button class="rb" id="objDel" style="color:#f23645">Hapus</button>
        <button class="rb" id="objDone">Selesai</button>
      </div>
      <div id="shI" class="sh">
        <div class="sh-head"><b>INDIKATOR TEKNIKAL</b><button class="cls-sh" id="clsShI">✕</button></div>
        <div class="gr">
          <button class="op" id="opE20"><span>EMA 20</span><b>OFF</b></button>
          <button class="op" id="opE50"><span>EMA 50</span><b>OFF</b></button>
          <button class="op" id="opM100"><span>MA 100</span><b>OFF</b></button>
          <button class="op" id="opBb"><span>Bollinger Bands</span><b>OFF</b></button>
          <button class="op" id="opRsi"><span>RSI 14</span><b>OFF</b></button>
        </div>
      </div>
      <div id="shD" class="sh">
        <div class="sh-head"><b>ALAT GAMBAR & FIBONACCI</b><button class="cls-sh" id="clsShD">✕</button></div>
        <div class="d-sec">Peralatan Tren</div>
        <div class="gr3">
          <button class="op3" data-tool="trend"><span>Garis Tren</span></button>
          <button class="op3" data-tool="ray"><span>Sinar</span></button>
          <button class="op3" data-tool="info"><span>Garis Info</span></button>
          <button class="op3" data-tool="ext"><span>Perpanjangan</span></button>
          <button class="op3" data-tool="hline"><span>Horizontal</span></button>
          <button class="op3" data-tool="hray"><span>Sinar Horiz</span></button>
          <button class="op3" data-tool="vline"><span>Vertikal</span></button>
          <button class="op3" data-tool="cross"><span>Persilangan</span></button>
          <button class="op3" data-tool="chan"><span>Kanal Paralel</span></button>
        </div>
        <div class="d-sec">Gann, Fibonacci & Proyeksi</div>
        <div class="gr3">
          <button class="op3" data-tool="fib"><span>Fib Retrace</span></button>
          <button class="op3" data-tool="fibext"><span>Fib Ekstensi</span></button>
          <button class="op3" data-tool="fibtz"><span>Fib Waktu</span></button>
          <button class="op3" data-tool="gannbox"><span>Kotak Gann</span></button>
          <button class="op3" data-tool="gannfan"><span>Kipas Gann</span></button>
          <button class="op3" data-tool="long"><span>Posisi Buy</span></button>
          <button class="op3" data-tool="short"><span>Posisi Sell</span></button>
          <button class="op3" data-tool="box"><span>Kotak Zona</span></button>
          <button class="op3" id="clrD" style="color:#f23645"><span>Hapus Semua</span></button>
        </div>
      </div>
    </div>
    <div id="bar">
      <div class="pk" id="openSrchBar"><b id="cSym">XAUUSD</b><span id="cBrk">OANDA</span>
        <select id="tf" onclick="event.stopPropagation()">
          <option value="1m">1m</option><option value="5m">5m</option><option value="15m" selected>15m</option>
          <option value="1h">1H</option><option value="4h">4H</option><option value="1d">1D</option>
        </select>
      </div>
      <button class="tb" id="bRep">Replay</button>
      <button class="tb" id="bD">Gambar</button>
      <button class="tb" id="bI">Indikator</button>
      <button class="tb" id="bC">Crosshair</button>
      <button class="tb" id="bU">Undo</button>
      <button class="tb on" id="bA">Auto</button>
    </div>
  </div>

  <div id="nav">
    <button class="nv" id="nW">Daftar Pantau</button>
    <button class="nv on" id="nC">Chart</button>
    <button class="nv" id="nI">Indikator</button>
  </div>
</div>

<script type="module" src="auth.js"></script>
</body>
</html>
