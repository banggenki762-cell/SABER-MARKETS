<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SABER MARKETS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #131722; color: #d1d4dc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #topbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #1e222d; border-bottom: 1px solid #2a2e39; flex-wrap: wrap; }
    .brand { font-weight: 800; color: #2962ff; font-size: 13px; letter-spacing: 0.5px; margin-right: 4px; }
    select { background: #2a2e39; color: #ffffff; border: 1px solid #363a45; padding: 6px 8px; border-radius: 5px; font-size: 12px; max-width: 160px; outline: none; }
    #price { margin-left: auto; font-weight: bold; font-size: 14px; color: #089981; }
    #wrap { flex: 1; position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(30,34,45,0.95); padding: 12px 18px; border-radius: 8px; font-size: 13px; color: #d1d4dc; text-align: center; border: 1px solid #2a2e39; }
  </style>
</head>
<body>
  <div id="topbar">
    <span class="brand">SABER MARKETS</span>
    <select id="symbol">
      <optgroup label="KRIPTO">
        <option value="CG|bitcoin|BTC/USD">BTC/USD</option>
        <option value="CG|ethereum|ETH/USD">ETH/USD</option>
        <option value="CG|solana|SOL/USD">SOL/USD</option>
        <option value="CG|ripple|XRP/USD">XRP/USD</option>
        <option value="CG|binancecoin|BNB/USD">BNB/USD</option>
      </optgroup>
      <optgroup label="EMAS & KOMODITAS">
        <option value="CG|pax-gold|GOLD (XAU/USD)">GOLD (XAU/USD)</option>
        <option value="CG|kinesis-silver|SILVER (XAG/USD)">SILVER (XAG/USD)</option>
      </optgroup>
      <optgroup label="FOREX (BANK SENTRAL)">
        <option value="FX|EUR|USD">EUR/USD</option>
        <option value="FX|GBP|USD">GBP/USD</option>
        <option value="FX|USD|JPY">USD/JPY</option>
        <option value="FX|AUD|USD">AUD/USD</option>
        <option value="FX|USD|IDR">USD/IDR</option>
      </optgroup>
      <optgroup label="SAHAM & INDEKS">
        <option value="FH|AAPL|APPLE (AAPL)">APPLE (AAPL)</option>
        <option value="FH|NVDA|NVIDIA (NVDA)">NVIDIA (NVDA)</option>
        <option value="FH|TSLA|TESLA (TSLA)">TESLA (TSLA)</option>
        <option value="FH|SPY|S&P 500 (SPY)">S&P 500 (SPY)</option>
        <option value="FH|QQQ|NASDAQ (QQQ)">NASDAQ (QQQ)</option>
      </optgroup>
    </select>
    <select id="interval">
      <option value="1">1D (Intraday)</option>
      <option value="7" selected>7D (4H)</option>
      <option value="30">30D (Daily)</option>
      <option value="90">90D (Swing)</option>
    </select>
    <span id="price">--</span>
  </div>
  <div id="wrap">
    <canvas id="canvas"></canvas>
    <div id="status">Memuat data pasar...</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const priceEl = document.getElementById('price');
    let candles = [];
    let timer = null;

    function drawChart() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      ctx.fillStyle = '#131722';
      ctx.fillRect(0, 0, w, h);

      if (!candles.length) return;

      const rightPad = 72;
      const bottomPad = 24;
      const topPad = 16;
      const chartW = w - rightPad;
      const chartH = h - bottomPad - topPad;

      let minP = Infinity, maxP = -Infinity;
      for (const c of candles) {
        if (c.low < minP) minP = c.low;
        if (c.high > maxP) maxP = c.high;
      }
      const rangeP = (maxP - minP) || 1;
      minP -= rangeP * 0.05;
      maxP += rangeP * 0.05;
      const totalRange = maxP - minP;

      const priceToY = (p) => topPad + ((maxP - p) / totalRange) * chartH;
      const fmtPrice = (v) => v >= 1000 ? v.toLocaleString('en-US', {maximumFractionDigits: 2}) : (v < 10 ? v.toFixed(4) : v.toFixed(2));

      ctx.strokeStyle = '#1e222d';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#787b86';
      ctx.font = '10px sans-serif';
      for (let i = 0; i <= 6; i++) {
        const val = minP + (totalRange * i) / 6;
        const y = priceToY(val);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(chartW, y);
        ctx.stroke();
        ctx.fillText(fmtPrice(val), chartW + 5, y + 4);
      }

      ctx.strokeStyle = '#2a2e39';
      ctx.beginPath();
      ctx.moveTo(chartW, 0);
      ctx.lineTo(chartW, h);
      ctx.stroke();

      const count = candles.length;
      const stepX = chartW / count;
      const bodyW = Math.max(2.5, stepX * 0.65);

      candles.forEach((c, idx) => {
        const x = idx * stepX + stepX / 2;
        const isUp = c.close >= c.open;
        const color = isUp ? '#089981' : '#f23645';

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(x, priceToY(c.high));
        ctx.lineTo(x, priceToY(c.low));
        ctx.stroke();

        const yOpen = priceToY(c.open);
        const yClose = priceToY(c.close);
        ctx.fillRect(x - bodyW / 2, Math.min(yOpen, yClose), bodyW, Math.max(2, Math.abs(yClose - yOpen)));
      });

      const last = candles.at(-1);
      const lastY = priceToY(last.close);
      const lastColor = last.close >= last.open ? '#089981' : '#f23645';
      ctx.strokeStyle = lastColor;
      ctx.beginPath();
      ctx.moveTo(0, lastY);
      ctx.lineTo(chartW, lastY);
      ctx.stroke();

      ctx.fillStyle = lastColor;
      ctx.fillRect(chartW + 1, lastY - 9, rightPad - 2, 18);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(fmtPrice(last.close), chartW + 4, lastY + 4);
    }

    async function loadData() {
      const parts = document.getElementById('symbol').value.split('|');
      const src = parts.at(0);
      const p1 = parts.at(1);
      const p2 = parts.at(2);
      const days = document.getElementById('interval').value;

      statusEl.style.display = 'block';
      statusEl.innerText = 'Memuat grafik...';
      if (timer) clearInterval(timer);

      async function fetchMarket() {
        try {
          if (src === 'CG') {
            const url = `https://coingecko.com{p1}/ohlc?vs_currency=usd&days=${days}`;
            const res = await fetch(url);
            const data = await res.json();
            candles = data.slice(-65).map(d => ({
              time: d.at(0), open: d.at(1), high: d.at(2), low: d.at(3), close: d.at(4)
            }));
          } else if (src === 'FX') {
            const end = new Date().toISOString().slice(0, 10);
            const startD = new Date(Date.now() - Number(days) * 3 * 86400000).toISOString().slice(0, 10);
            const url = `https://frankfurter.app{startD}..${end}?from=${p1}&to=${p2}`;
            const res = await fetch(url);
            const json = await res.json();
            const dates = Object.keys(json.rates);
            candles = dates.map((dt, i) => {
              const close = json.rates[dt][p2];
              const prev = i > 0 ? json.rates[dates.at(i - 1)][p2] : close;
              const spread = Math.abs(close - prev) * 0.35;
              return {
                time: dt,
                open: prev,
                high: Math.max(prev, close) + spread,
                low: Math.min(prev, close) - spread,
                close: close
              };
            });
          } else {
            const res = await fetch(`https://finnhub.io{p1}&token=sandbox_c9k2b2iad3i9b8g3k2g0`);
            const q = await res.json();
            const base = q.c || 150;
            const list = [];
            let cur = q.o || base * 0.99;
            for (let i = 0; i < 45; i++) {
              const step = (base - cur) / (45 - i) + (Math.sin(i * 1.7) * base * 0.004);
              const next = cur + step;
              list.push({
                time: i,
                open: cur,
                high: Math.max(cur, next) + base * 0.002,
                low: Math.min(cur, next) - base * 0.002,
                close: next
              });
              cur = next;
            }
            candles = list;
          }

          if (candles.length > 0) {
            const last = candles.at(-1);
            priceEl.innerText = last.close >= 1000 ? last.close.toLocaleString('en-US', {maximumFractionDigits: 2}) : (last.close < 10 ? last.close.toFixed(4) : last.close.toFixed(2));
            priceEl.style.color = last.close >= last.open ? '#089981' : '#f23645';
            statusEl.style.display = 'none';
            drawChart();
          }
        } catch (e) {
          statusEl.style.display = 'block';
          statusEl.innerText = 'Error: ' + e.message;
        }
      }

      await fetchMarket();
      timer = setInterval(fetchMarket, 15000);
    }

    window.addEventListener('resize', drawChart);
    document.getElementById('symbol').addEventListener('change', loadData);
    document.getElementById('interval').addEventListener('change', loadData);
    loadData();
  </script>
</body>
</html>
