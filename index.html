<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SABER MARKETS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #131722; color: #d1d4dc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #topbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #1e222d; border-bottom: 1px solid #2a2e39; flex-wrap: wrap; }
    .brand { font-weight: 800; color: #2962ff; font-size: 13px; letter-spacing: 0.5px; margin-right: 4px; }
    select { background: #2a2e39; color: #ffffff; border: 1px solid #363a45; padding: 6px 8px; border-radius: 5px; font-size: 12px; max-width: 155px; outline: none; }
    #price { margin-left: auto; font-weight: bold; font-size: 14px; color: #089981; }
    #wrap { flex: 1; position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(30,34,45,0.95); padding: 12px 18px; border-radius: 8px; font-size: 13px; color: #d1d4dc; text-align: center; border: 1px solid #2a2e39; }
  </style>
</head>
<body>
  <div id="topbar">
    <span class="brand">SABER MARKETS</span>
    <select id="symbol">
      <optgroup label="KRIPTO (SERVER ID)">
        <option value="ID|BTCIDR|BTC">BTC/IDR</option>
        <option value="ID|ETHIDR|ETH">ETH/IDR</option>
        <option value="ID|SOLIDR|SOL">SOL/IDR</option>
        <option value="ID|XRPIDR|XRP">XRP/IDR</option>
        <option value="ID|USDTIDR|USDT">USDT/IDR</option>
      </optgroup>
      <optgroup label="KRIPTO GLOBAL (USD)">
        <option value="KR|XBTUSD|BTC">BTC/USD</option>
        <option value="KR|ETHUSD|ETH">ETH/USD</option>
        <option value="KR|SOLUSD|SOL">SOL/USD</option>
      </optgroup>
      <optgroup label="EMAS & KOMODITAS">
        <option value="KR|PAXGUSD|XAU">GOLD (XAU/USD)</option>
        <option value="YF|SI=F|XAG">SILVER (XAG/USD)</option>
        <option value="YF|CL=F|WTI">CRUDE OIL (WTI)</option>
      </optgroup>
      <optgroup label="FOREX">
        <option value="KR|EURUSD|EUR">EUR/USD</option>
        <option value="KR|GBPUSD|GBP">GBP/USD</option>
        <option value="KR|USDJPY|JPY">USD/JPY</option>
        <option value="KR|AUDUSD|AUD">AUD/USD</option>
      </optgroup>
      <optgroup label="INDEKS & SAHAM">
        <option value="YF|^JKSE|IHSG">IHSG (IDX)</option>
        <option value="YF|BBCA.JK|BBCA">BBCA (Bank BCA)</option>
        <option value="YF|BBRI.JK|BBRI">BBRI (Bank BRI)</option>
        <option value="YF|^GSPC|SPX">S&P 500</option>
        <option value="YF|NVDA|NVDA">NVIDIA (NVDA)</option>
      </optgroup>
    </select>
    <select id="interval">
      <option value="1">1m</option>
      <option value="5">5m</option>
      <option value="15" selected>15m</option>
      <option value="60">1H</option>
      <option value="1D">1D</option>
    </select>
    <span id="price">--</span>
  </div>
  <div id="wrap">
    <canvas id="canvas"></canvas>
    <div id="status">Memuat data pasar...</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const priceEl = document.getElementById('price');
    let candles = [];
    let timer = null;

    function drawChart() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      ctx.fillStyle = '#131722';
      ctx.fillRect(0, 0, w, h);

      if (!candles.length) return;

      const rightPad = 72;
      const bottomPad = 24;
      const topPad = 16;
      const chartW = w - rightPad;
      const chartH = h - bottomPad - topPad;

      let minP = Infinity, maxP = -Infinity;
      for (const c of candles) {
        if (c.low < minP) minP = c.low;
        if (c.high > maxP) maxP = c.high;
      }
      const rangeP = (maxP - minP) || 1;
      minP -= rangeP * 0.05;
      maxP += rangeP * 0.05;
      const totalRange = maxP - minP;

      const priceToY = (p) => topPad + ((maxP - p) / totalRange) * chartH;
      const fmtPrice = (v) => v >= 1000 ? Math.round(v).toLocaleString('id-ID') : (v < 10 ? v.toFixed(4) : v.toFixed(2));

      ctx.strokeStyle = '#1e222d';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#787b86';
      ctx.font = '10px sans-serif';
      for (let i = 0; i <= 6; i++) {
        const val = minP + (totalRange * i) / 6;
        const y = priceToY(val);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(chartW, y);
        ctx.stroke();
        ctx.fillText(fmtPrice(val), chartW + 5, y + 4);
      }

      ctx.strokeStyle = '#2a2e39';
      ctx.beginPath();
      ctx.moveTo(chartW, 0);
      ctx.lineTo(chartW, h);
      ctx.stroke();

      const count = candles.length;
      const stepX = chartW / count;
      const bodyW = Math.max(2, stepX * 0.65);

      candles.forEach((c, idx) => {
        const x = idx * stepX + stepX / 2;
        const isUp = c.close >= c.open;
        const color = isUp ? '#089981' : '#f23645';

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(x, priceToY(c.high));
        ctx.lineTo(x, priceToY(c.low));
        ctx.stroke();

        const yOpen = priceToY(c.open);
        const yClose = priceToY(c.close);
        ctx.fillRect(x - bodyW / 2, Math.min(yOpen, yClose), bodyW, Math.max(1.5, Math.abs(yClose - yOpen)));
      });

      const last = candles.at(-1);
      const lastY = priceToY(last.close);
      const lastColor = last.close >= last.open ? '#089981' : '#f23645';
      ctx.strokeStyle = lastColor;
      ctx.beginPath();
      ctx.moveTo(0, lastY);
      ctx.lineTo(chartW, lastY);
      ctx.stroke();

      ctx.fillStyle = lastColor;
      ctx.fillRect(chartW + 1, lastY - 9, rightPad - 2, 18);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(fmtPrice(last.close), chartW + 4, lastY + 4);
    }

    async function loadData() {
      const parts = document.getElementById('symbol').value.split('|');
      const src = parts.at(0);
      const ticker = parts.at(1);
      const label = parts.at(2);
      const intv = document.getElementById('interval').value;

      statusEl.style.display = 'block';
      statusEl.innerText = 'Memuat ' + label + '...';
      if (timer) clearInterval(timer);

      async function fetchMarket() {
        try {
          if (src === 'ID') {
            const now = Math.floor(Date.now() / 1000);
            const mult = intv === '1D' ? 86400 : Number(intv) * 60;
            const from = now - mult * 80;
            const url = `https://indodax.com{from}&symbol=${ticker}&tf=${intv}&to=${now}`;
            const res = await fetch(url);
            const data = await res.json();
            candles = data.slice(-70).map(d => ({
              time: d.Time, open: Number(d.Open), high: Number(d.High), low: Number(d.Low), close: Number(d.Close)
            }));
          } else if (src === 'KR') {
            const kIntv = intv === '1D' ? 1440 : Number(intv);
            const url = `https://kraken.com{ticker}&interval=${kIntv}`;
            const res = await fetch(url);
            const json = await res.json();
            const key = Object.keys(json.result).find(k => k !== 'last');
            const rows = json.result[key].slice(-70);
            candles = rows.map(r => ({
              time: Number(r.at(0)), open: Number(r.at(1)), high: Number(r.at(2)), low: Number(r.at(3)), close: Number(r.at(4))
            }));
          } else {
            const yIntv = intv === '1D' ? '1d' : (intv === '60' ? '1h' : intv + 'm');
            const range = intv === '1D' ? '6mo' : (intv === '60' ? '1mo' : '5d');
            const yf = `https://yahoo.com{encodeURIComponent(ticker)}?interval=${yIntv}&range=${range}`;
            const proxy = `https://codetabs.com{encodeURIComponent(yf)}`;
            const res = await fetch(proxy);
            const json = await res.json();
            const result = json.chart.result.at(0);
            const ts = result.timestamp;
            const q = result.indicators.quote.at(0);
            const list = [];
            for (let i = 0; i < ts.length; i++) {
              const o = q.open.at(i), h = q.high.at(i), l = q.low.at(i), c = q.close.at(i);
              if (o !== null && c !== null) list.push({ time: ts.at(i), open: o, high: h, low: l, close: c });
            }
            candles = list.slice(-70);
          }

          if (candles.length > 0) {
            const last = candles.at(-1);
            priceEl.innerText = last.close >= 1000 ? Math.round(last.close).toLocaleString('id-ID') : (last.close < 10 ? last.close.toFixed(4) : last.close.toFixed(2));
            priceEl.style.color = last.close >= last.open ? '#089981' : '#f23645';
            statusEl.style.display = 'none';
            drawChart();
          }
        } catch (e) {
          statusEl.style.display = 'block';
          statusEl.innerText = 'Jalur ' + label + ' terblokir operator. Coba pilih instrumen lain (misal BTC/IDR atau GOLD/FOREX).';
        }
      }

      await fetchMarket();
      timer = setInterval(fetchMarket, 8000);
    }

    window.addEventListener('resize', drawChart);
    document.getElementById('symbol').addEventListener('change', loadData);
    document.getElementById('interval').addEventListener('change', loadData);
    loadData();
  </script>
</body>
</html>
