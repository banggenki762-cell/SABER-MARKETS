<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SABER MARKETS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#000;color:#d1d4dc;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh}
.pg{flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden}
.pg.on{display:flex}
#wlH{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #1e222d}
#wlS{width:100%;background:#161a23;border:1px solid #2a2e39;color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;outline:none}
#wlL{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #14171f;cursor:pointer}
.ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;color:#fff;flex-shrink:0}
.mid{flex:1;min-width:0}
.sym{font-weight:700;font-size:14px;color:#fff}
.dsc{font-size:11px;color:#787b86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rgt{text-align:right;flex-shrink:0}
.prc{font-weight:700;font-size:14px;color:#fff}
.chg{font-size:11px;margin-top:2px}
.up{color:#089981}.dn{color:#f23645}.nt{color:#787b86}
#cW{flex:1;position:relative;width:100%;min-height:0;touch-action:none;background:#0b0e14}
canvas{display:block;width:100%;height:100%}
#hnt{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#2962ff;color:#fff;padding:4px 12px;border-radius:12px;font-size:11px;display:none;white-space:nowrap}
#bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0b0e14;border-top:1px solid #1e222d;overflow-x:auto;flex-shrink:0}
.pk{display:flex;align-items:center;gap:5px;background:#161a23;padding:5px 9px;border-radius:6px;border:1px solid #2a2e39;flex-shrink:0}
.pk b{color:#fff;font-size:13px}
.pk select{background:none;border:none;color:#d1d4dc;font-size:12px;font-weight:600;outline:none}
.tb{background:none;border:1px solid #222631;color:#d1d4dc;padding:5px 8px;border-radius:6px;font-size:12px;flex-shrink:0}
.tb.on{color:#fff;background:#2962ff;border-color:#2962ff}
#nav{display:flex;justify-content:space-around;padding:7px 0 9px;background:#000;border-top:1px solid #1e222d;flex-shrink:0}
.nv{background:none;border:none;color:#787b86;font-size:11px;font-weight:600}
.nv.on{color:#fff}
.sh{position:absolute;bottom:8px;left:10px;right:10px;background:#161a23;border:1px solid #2a2e39;border-radius:10px;padding:10px;display:none;z-index:20}
.sh.on{display:block}
.gr{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}
.op{background:#222631;border:1px solid #2f3441;color:#d1d4dc;padding:8px;border-radius:6px;font-size:12px;display:flex;justify-content:space-between}
.op.on{border-color:#2962ff;background:rgba(41,98,255,.25);color:#fff}
@media (orientation:landscape){#nav{display:none}#bar{padding:4px 10px}}
</style>
</head>
<body>
<div id="pgW" class="pg">
  <div id="wlH"><b style="font-size:15px">SABER <span style="color:#2962ff">MARKETS</span></b><span style="font-size:11px;color:#787b86">Daftar Pantau</span></div>
  <div style="padding:8px 12px"><input id="wlS" placeholder="Cari simbol (XAUUSD, BBCA, BTC, EURUSD...)"></div>
  <div id="wlL"></div>
</div>
<div id="pgC" class="pg on">
  <div id="cW">
    <canvas id="cv"></canvas>
    <div id="hnt">Sentuh & tarik di grafik</div>
    <div id="shI" class="sh"><b style="font-size:11px;color:#787b86">INDIKATOR</b>
      <div class="gr">
        <button class="op" data-i="e20"><span>EMA 20</span><b>OFF</b></button>
        <button class="op" data-i="e50"><span>EMA 50</span><b>OFF</b></button>
        <button class="op" data-i="m100"><span>MA 100</span><b>OFF</b></button>
        <button class="op" data-i="rsi"><span>RSI 14</span><b>OFF</b></button>
      </div>
    </div>
    <div id="shD" class="sh"><b style="font-size:11px;color:#787b86">ALAT GAMBAR</b>
      <div class="gr">
        <button class="op" data-t="trend"><span>Trendline</span><b>/</b></button>
        <button class="op" data-t="hline"><span>Garis Horizontal</span><b>-</b></button>
        <button class="op" data-t="fib"><span>Fibonacci</span><b>F</b></button>
        <button class="op" data-t="box"><span>Kotak Zona</span><b>[]</b></button>
        <button class="op" id="clrD" style="grid-column:span 2;color:#f23645;justify-content:center">Hapus Semua Gambar</button>
      </div>
    </div>
  </div>
  <div id="bar">
    <div class="pk" id="openW"><b id="cSym">XAUUSD</b>
      <select id="tf" onclick="event.stopPropagation()">
        <option value="1">1m</option><option value="5">5m</option><option value="15" selected>15m</option>
        <option value="60">1H</option><option value="240">4H</option><option value="1440">1D</option>
      </select>
    </div>
    <button class="tb" id="bD">Gambar</button>
    <button class="tb" id="bI">Indikator</button>
    <button class="tb" id="bC">Crosshair</button>
    <button class="tb" id="bU">Undo</button>
    <button class="tb on" id="bA">Auto</button>
  </div>
</div>
<div id="nav">
  <button class="nv" id="nW">Daftar Pantau</button>
  <button class="nv on" id="nC">Chart</button>
  <button class="nv" id="nI">Indikator</button>
</div>
<script>
const ITEMS=[
  {s:'XAUUSD',d:'Emas / Dollar A.S.',c:'USD',bg:'#eab308',tx:'AU',p:3568.35,chg:-69.73,pct:-1.92,fx:0},
  {s:'USDJPY',d:'Dollar A.S. / Yen Jepang',c:'JPY',bg:'#ef4444',tx:'JP',p:159.04,chg:0.043,pct:0.03,fx:1,b:'USD',q:'JPY'},
  {s:'EURUSD',d:'Euro / Dollar A.S.',c:'USD',bg:'#2563eb',tx:'EU',p:1.0542,chg:0.0018,pct:0.17,fx:1,b:'EUR',q:'USD'},
  {s:'USDIDR',d:'Dollar A.S. / Rupiah',c:'IDR',bg:'#dc2626',tx:'ID',p:15925,chg:35,pct:0.22,fx:1,b:'USD',q:'IDR'},
  {s:'COMPOSITE',d:'Indeks Harga Saham Gabungan',c:'IDR',bg:'#b91c1c',tx:'IDX',p:7241.58,chg:24.15,pct:0.33,fx:0},
  {s:'BBCA',d:'Bank Central Asia Tbk',c:'IDR',bg:'#1d4ed8',tx:'BCA',p:10150,chg:125,pct:1.25,fx:0},
  {s:'BBRI',d:'Bank Rakyat Indonesia Tbk',c:'IDR',bg:'#0284c7',tx:'BRI',p:4380,chg:-40,pct:-0.90,fx:0},
  {s:'BUMI',d:'PT Bumi Resources Tbk',c:'IDR',bg:'#ea580c',tx:'BM',p:129,chg:1,pct:0.78,fx:0},
  {s:'BUVA',d:'PT Bukit Uluwatu Villa Tbk',c:'IDR',bg:'#0f766e',tx:'BV',p:294,chg:4,pct:1.38,fx:0},
  {s:'WBSA',d:'PT BSA Logistics Indonesia Tbk',c:'IDR',bg:'#dc2626',tx:'BSA',p:446,chg:0,pct:0.00,fx:0},
  {s:'SUPA',d:'PT Super Bank Indonesia Tbk',c:'IDR',bg:'#16a34a',tx:'SP',p:342,chg:-4,pct:-1.16,fx:0},
  {s:'BULL',d:'PT Buana Lintas Lautan Tbk',c:'IDR',bg:'#991b1b',tx:'BL',p:234,chg:-8,pct:-3.31,fx:0},
  {s:'BTCUSD',d:'Bitcoin / Dollar A.S.',c:'USD',bg:'#f97316',tx:'BTC',p:96450,chg:1240,pct:1.30,fx:0},
  {s:'ETHUSD',d:'Ethereum / Dollar A.S.',c:'USD',bg:'#6366f1',tx:'ETH',p:3385,chg:-42,pct:-1.22,fx:0},
  {s:'SOLUSD',d:'Solana / Dollar A.S.',c:'USD',bg:'#8b5cf6',tx:'SOL',p:238.50,chg:6.80,pct:2.93,fx:0}
];
let cur=ITEMS.at(0),data=[],drw=[],ind={e20:0,e50:0,m100:0,rsi:0},crOn=0,tool=null,tmp=null,crI=-1,tmr=null,vC=55,rO=-10,vS=1,vP=0;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),hnt=document.getElementById('hnt');
const fmt=(v,c)=>c==='IDR'?v.toLocaleString('id-ID',{maximumFractionDigits:2}):v<10?v.toFixed(4):v.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:3});
function renderWL(q=''){
  wlL.innerHTML='';
  ITEMS.filter(x=>x.s.includes(q.toUpperCase())||x.d.toLowerCase().includes(q.toLowerCase())).forEach(it=>{
    const cls=it.chg>0?'up':it.chg<0?'dn':'nt',sg=it.chg>0?'+':'',el=document.createElement('div');
    el.className='row';
    el.innerHTML='<div class="ico" style="background:'+it.bg+'">'+it.tx+'</div><div class="mid"><div class="sym">'+it.s+'</div><div class="dsc">'+it.d+'</div></div><div class="rgt"><div class="prc">'+fmt(it.p,it.c)+'</div><div class="chg '+cls+'">'+sg+fmt(it.chg,it.c)+' '+sg+it.pct.toFixed(2)+'%</div></div>';
    el.onclick=()=>{cur=it;cSym.innerText=it.s;go('c');init()};
    wlL.appendChild(el);
  });
}
function go(p){pgW.classList.toggle('on',p==='w');pgC.classList.toggle('on',p==='c');nW.classList.toggle('on',p==='w');nC.classList.toggle('on',p==='c');if(p==='c')setTimeout(draw,50)}
function cdwn(m){const d=new Date(),s=d.getSeconds(),mn=d.getMinutes(),h=d.getHours();if(m>=1440)return String(23-h).padStart(2,'0')+':'+String(59-mn).padStart(2,'0');const l=Math.max(1,m*60-(((h*60+mn)%m)*60+s));return String(Math.floor(l/60)).padStart(2,'0')+':'+String(l%60).padStart(2,'0')}
const ema=(a,p)=>{let o=[],e=a.at(0).c,k=2/(p+1);a.forEach(x=>{e=x.c*k+e*(1-k);o.push(e)});return o};
const sma=(a,p)=>a.map((_,i)=>{let s=a.slice(Math.max(0,i-p+1),i+1);return s.reduce((x,y)=>x+y.c,0)/s.length});
const rsi=(a,p=14)=>a.map((_,i)=>{if(i<p)return 50;let u=0,d=0;for(let j=i-p+1;j<=i;j++){let f=a.at(j).c-a.at(j-1).c;f>=0?u+=f:d-=f}return 100-100/(1+(d===0?100:u/d))});
function draw(){
  const dpr=window.devicePixelRatio||1,rc=cv.parentElement.getBoundingClientRect();if(!rc.width||!rc.height)return;
  cv.width=rc.width*dpr;cv.height=rc.height*dpr;ctx.scale(dpr,dpr);
  const w=rc.width,h=rc.height;ctx.fillStyle='#0b0e14';ctx.fillRect(0,0,w,h);if(!data.length)return;
  const rP=72,bP=20,tP=24,rH=ind.rsi?Math.floor(h*0.22):0,cW=w-rP,cH=h-bP-tP-rH;
  rO=Math.min(Math.max(0,data.length-5),Math.max(-Math.floor(vC*0.75),Math.round(rO)));
  const end=data.length-rO,st=end-vC;
  let mn=Infinity,mx=-Infinity;for(let i=Math.max(0,st);i<Math.min(data.length,end);i++){const c=data.at(i);if(c.l<mn)mn=c.l;if(c.h>mx)mx=c.h}
  if(!isFinite(mn)){const l=data.at(-1);mn=l.l;mx=l.h}
  const mid=(mx+mn)/2,hf=((mx-mn)||1)/2,sH=(hf*1.15)/vS,cen=mid+vP*hf,top=cen+sH,bot=cen-sH,rng=(top-bot)||1;
  const toY=p=>tP+((top-p)/rng)*cH,toP=y=>top-((y-tP)/cH)*rng,sX=cW/vC,i2x=i=>(i-st)*sX+sX/2,x2i=x=>Math.round(st+(x-sX/2)/sX);
  ctx.strokeStyle='#151922';ctx.lineWidth=1;ctx.fillStyle='#787b86';ctx.font='10px sans-serif';
  for(let i=0;i<=6;i++){const v=bot+(rng*i)/6,y=toY(v);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();ctx.fillText(fmt(v,cur.c),cW+6,y+3)}
  ctx.strokeStyle='#1e222d';ctx.beginPath();ctx.moveTo(cW,0);ctx.lineTo(cW,h);ctx.moveTo(0,h-bP);ctx.lineTo(w,h-bP);ctx.stroke();
  ctx.fillStyle='#868993';ctx.font='bold 10px sans-serif';ctx.fillText(cur.c,cW+14,15);
  ctx.save();ctx.beginPath();ctx.rect(0,tP,cW,cH);ctx.clip();
  const bW=Math.max(2,sX*0.64);
  for(let i=Math.max(0,st);i<Math.min(data.length,end);i++){const c=data.at(i),x=i2x(i),col=c.c>=c.o?'#089981':'#f23645';ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x,toY(c.h));ctx.lineTo(x,toY(c.l));ctx.stroke();const yO=toY(c.o),yC=toY(c.c);ctx.fillRect(x-bW/2,Math.min(yO,yC),bW,Math.max(2,Math.abs(yC-yO)))}
  const ln=(ar,cl)=>{ctx.strokeStyle=cl;ctx.lineWidth=1.4;ctx.beginPath();let s=0;for(let i=Math.max(0,st);i<Math.min(data.length,end);i++){const x=i2x(i),y=toY(ar.at(i));if(!s){ctx.moveTo(x,y);s=1}else ctx.lineTo(x,y)}ctx.stroke()};
  if(ind.e20)ln(ema(data,20),'#2962ff');if(ind.e50)ln(ema(data,50),'#f59e0b');if(ind.m100)ln(sma(data,100),'#ec4899');
  (tmp?[...drw,tmp]:drw).forEach(d=>{
    const x1=i2x(d.i1),y1=toY(d.p1),x2=i2x(d.i2),y2=toY(d.p2);
    if(d.t==='hline'){ctx.strokeStyle='#f59e0b';ctx.beginPath();ctx.moveTo(0,y1);ctx.lineTo(cW,y1);ctx.stroke()}
    else if(d.t==='trend'){ctx.strokeStyle='#38bdf8';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
    else if(d.t==='box'){ctx.fillStyle='rgba(41,98,255,.2)';ctx.strokeStyle='#2962ff';ctx.fillRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));ctx.strokeRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1))}
    else if(d.t==='fib'){[0,0.382,0.5,0.618,1].forEach(lv=>{const pr=d.p1+(d.p2-d.p1)*lv,yy=toY(pr);ctx.strokeStyle='#2962ff';ctx.beginPath();ctx.moveTo(Math.min(x1,x2),yy);ctx.lineTo(Math.max(x1,x2)+40,yy);ctx.stroke();ctx.fillStyle='#38bdf8';ctx.fillText((lv*100).toFixed(1)+'%',Math.min(x1,x2)+4,yy-2)})}
  });
  const lst=data.at(-1),lY=toY(lst.c),lC=lst.c>=lst.o?'#089981':'#f23645';
  ctx.strokeStyle=lC;ctx.beginPath();ctx.moveTo(0,lY);ctx.lineTo(cW,lY);ctx.stroke();ctx.restore();
  if(lY>=tP&&lY<=tP+cH){ctx.fillStyle=lC;ctx.fillRect(cW+2,lY-14,rP-4,28);ctx.fillStyle='#fff';ctx.font='bold 10px sans-serif';ctx.fillText(fmt(lst.c,cur.c),cW+6,lY-2);ctx.font='9px sans-serif';ctx.fillText(cdwn(Number(tf.value)),cW+6,lY+10)}
  if(ind.rsi){const rT=tP+cH+6,rB=rH-8,rs=rsi(data,14);ctx.strokeStyle='#a855f7';ctx.beginPath();let s=0;for(let i=Math.max(0,st);i<Math.min(data.length,end);i++){const x=i2x(i),y=rT+((100-rs.at(i))/100)*rB;if(!s){ctx.moveTo(x,y);s=1}else ctx.lineTo(x,y)}ctx.stroke();ctx.fillStyle='#a855f7';ctx.fillText('RSI '+Math.round(rs.at(-1)),cW+6,rT+rB/2)}
  if(crOn&&crI>=0&&crI<data.length){const cc=data.at(crI),cx=i2x(crI),cy=toY(cc.c);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.moveTo(cx,tP);ctx.lineTo(cx,h-bP);ctx.moveTo(0,cy);ctx.lineTo(cW,cy);ctx.stroke();ctx.fillStyle='#161a23';ctx.fillRect(8,8,220,18);ctx.fillStyle='#fff';ctx.fillText('O:'+fmt(cc.o,cur.c)+' H:'+fmt(cc.h,cur.c)+' L:'+fmt(cc.l,cur.c)+' C:'+fmt(cc.c,cur.c),12,20)}
  cv._w=cW;cv._p=toP;cv._i=x2i;
}
async function init(){
  if(tmr)clearInterval(tmr);drw=[];tmp=null;crI=-1;rO=-10;vS=1;vP=0;bA.classList.add('on');let anc=cur.p;
  try{if(cur.fx){const r=await fetch('https://frankfurter.app),j=await r.json();if(j&&j.rates&&j.rates[cur.q])anc=parseFloat(j.rates[cur.q])||anc}}catch(e){}
  const m=parseInt(tf.value,10)||15,vol=anc*(0.0005*Math.sqrt(Math.min(m,240)));let c0=anc*(1-0.006*Math.cos(m)),bi=0;data=[];
  for(let i=0;i<240;i++){if(i%14===0)bi=(Math.random()-0.48)*vol*0.85;const mv=bi+((anc-c0)/(240-i))*0.25+(Math.random()-0.5)*vol*1.4,o=c0,c=i===239?anc:o+mv,bd=Math.abs(c-o);data.push({o,h:Math.max(o,c)+bd*(0.2+Math.random()*0.5)+vol*0.12,l:Math.min(o,c)-bd*(0.2+Math.random()*0.5)-vol*0.12,c});c0=c}
  draw();tmr=setInterval(()=>{const l=data.at(-1);l.c+=(Math.random()-0.495)*l.c*0.0003;if(l.c>l.h)l.h=l.c;if(l.c<l.l)l.l=l.c;draw()},1000);
}
let dg=0,md='p',sX=0,sY=0,sO=0,sV=1,sP=0,pD=0,pC=55;
cv.addEventListener('touchstart',e=>{shI.classList.remove('on');shD.classList.remove('on');const rc=cv.getBoundingClientRect();if(e.touches.length===2){dg=0;pD=Math.hypot(e.touches.item(0).clientX-e.touches.item(1).clientX,e.touches.item(0).clientY-e.touches.item(1).clientY);pC=vC;return}const t=e.touches.item(0),x=t.clientX-rc.left,y=t.clientY-rc.top;if(tool&&cv._p&&cv._i){const i=cv._i(x),pr=cv._p(y);if(tool==='hline'){drw.push({t:'hline',i1:i,p1:pr,i2:i,p2:pr});tool=null;hnt.style.display='none';bD.classList.remove('on');draw();return}tmp={t:tool,i1:i,p1:pr,i2:i,p2:pr};draw();return}if(crOn&&cv._i){crI=Math.min(data.length-1,Math.max(0,cv._i(x)));draw();return}dg=1;sX=x;sY=y;sO=rO;sV=vS;sP=vP;md=(cv._w&&x>cv._w)?'v':'p'},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const rc=cv.getBoundingClientRect();if(e.touches.length===2&&pD>0){const d=Math.hypot(e.touches.item(0).clientX-e.touches.item(1).clientX,e.touches.item(0).clientY-e.touches.item(1).clientY);vC=Math.min(200,Math.max(12,Math.round(pC*(pD/Math.max(10,d)))));draw();return}const t=e.touches.item(0),x=t.clientX-rc.left,y=t.clientY-rc.top;if(tmp&&cv._p&&cv._i){tmp.i2=cv._i(x);tmp.p2=cv._p(y);draw();return}if(crOn&&cv._i){crI=Math.min(data.length-1,Math.max(0,cv._i(x)));draw();return}if(!dg)return;if(md==='v'){vS=Math.min(4.5,Math.max(0.25,sV*Math.exp(-(y-sY)*0.008)));bA.classList.remove('on');draw()}else{rO=sO+((x-sX)/((cv._w||300)/vC));if(!bA.classList.contains('on'))vP=sP+((y-sY)/140)/vS;draw()}},{passive:false});
cv.addEventListener('touchend',()=>{if(tmp){drw.push(tmp);tmp=null;tool=null;hnt.style.display='none';bD.classList.remove('on');draw()}dg=0;pD=0});
nW.onclick=()=>go('w');nC.onclick=()=>go('c');nI.onclick=()=>{go('c');shD.classList.remove('on');shI.classList.toggle('on')};openW.onclick=()=>go('w');wlS.oninput=e=>renderWL(e.target.value);
bD.onclick=()=>{shI.classList.remove('on');shD.classList.toggle('on')};bI.onclick=()=>{shD.classList.remove('on');shI.classList.toggle('on')};bC.onclick=()=>{crOn=!crOn;bC.classList.toggle('on',crOn);if(!crOn)crI=-1;draw()};bU.onclick=()=>{drw.pop();draw()};bA.onclick=()=>{vS=1;vP=0;rO=-10;bA.classList.add('on');draw()};
