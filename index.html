<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SABER MARKETS</title>
  <script src="https://unpkg.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #131722; color: #d1d4dc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #topbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #1e222d; border-bottom: 1px solid #2a2e39; flex-wrap: wrap; }
    .brand { font-weight: bold; color: #2962ff; font-size: 14px; margin-right: 4px; }
    select { background: #2a2e39; color: #fff; border: 1px solid #363a45; padding: 6px 10px; border-radius: 4px; font-size: 13px; }
    #price { margin-left: auto; font-weight: bold; font-size: 15px; color: #089981; }
    #chart { flex: 1; width: 100%; }
  </style>
</head>
<body>
  <div id="topbar">
    <span class="brand">SABER MARKETS</span>
    <select id="symbol">
      <option value="BTC">BTC/USDT</option>
      <option value="ETH">ETH/USDT</option>
      <option value="SOL">SOL/USDT</option>
      <option value="XRP">XRP/USDT</option>
      <option value="PAXG">GOLD (XAU)</option>
      <option value="BNB">BNB/USDT</option>
    </select>
    <select id="interval">
      <option value="1m">1m</option>
      <option value="5m">5m</option>
      <option value="15m" selected>15m</option>
      <option value="1H">1H</option>
      <option value="4H">4H</option>
      <option value="1D">1D</option>
    </select>
    <span id="price">Memuat...</span>
  </div>
  <div id="chart"></div>

  <script>
    const chartContainer = document.getElementById('chart');
    const chart = LightweightCharts.createChart(chartContainer, {
      layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: '#2a2e39' },
      timeScale: { borderColor: '#2a2e39', timeVisible: true }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#089981', downColor: '#f23645', borderVisible: false,
      wickUpColor: '#089981', wickDownColor: '#f23645'
    });

    let timer;
    async function loadChart() {
      const sym = document.getElementById('symbol').value;
      const intv = document.getElementById('interval').value;
      const instId = sym + '-USDT';
      document.getElementById('price').innerText = 'Memuat...';

      if (timer) clearInterval(timer);

      async function fetchCandles() {
        try {
          const res = await fetch(`https://okx.com{instId}&bar=${intv}&limit=200`);
          const json = await res.json();
          if (json && json.data && json.data.length > 0) {
            const candles = json.data.reverse().map(d => ({
              time: Math.floor(Number(d.at(0)) / 1000),
              open: parseFloat(d.at(1)),
              high: parseFloat(d.at(2)),
              low: parseFloat(d.at(3)),
              close: parseFloat(d.at(4))
            }));
            candleSeries.setData(candles);
            const last = candles.at(-1);
            document.getElementById('price').innerText = '$' + last.close.toLocaleString();
          }
        } catch (err) {
          document.getElementById('price').innerText = 'Gagal Muat';
        }
      }

      await fetchCandles();
      timer = setInterval(fetchCandles, 3000);
    }

    window.addEventListener('resize', () => {
      chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
    });

    document.getElementById('symbol').addEventListener('change', loadChart);
    document.getElementById('interval').addEventListener('change', loadChart);
    loadChart();
  </script>
</body>
</html>
