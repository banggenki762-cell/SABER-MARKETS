<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SABER MARKETS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #131722; color: #d1d4dc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #topbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #1e222d; border-bottom: 1px solid #2a2e39; flex-wrap: wrap; }
    .brand { font-weight: 800; color: #2962ff; font-size: 13px; letter-spacing: 0.5px; margin-right: 4px; }
    select { background: #2a2e39; color: #ffffff; border: 1px solid #363a45; padding: 6px 8px; border-radius: 5px; font-size: 12px; max-width: 155px; outline: none; }
    #price { margin-left: auto; font-weight: bold; font-size: 14px; color: #089981; }
    #badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #2a2e39; color: #868993; }
    #wrap { flex: 1; position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="topbar">
    <span class="brand">SABER MARKETS</span>
    <select id="symbol">
      <optgroup label="FOREX">
        <option value="FX|EUR|USD|1.0520">EUR/USD</option>
        <option value="FX|GBP|USD|1.2640">GBP/USD</option>
        <option value="FX|USD|JPY|154.20">USD/JPY</option>
        <option value="FX|AUD|USD|0.6510">AUD/USD</option>
        <option value="FX|USD|IDR|15920">USD/IDR</option>
      </optgroup>
      <optgroup label="EMAS & KOMODITAS">
        <option value="CMD|XAUUSD|2635.50">GOLD (XAU/USD)</option>
        <option value="CMD|XAGUSD|31.25">SILVER (XAG/USD)</option>
        <option value="CMD|WTI|69.40">CRUDE OIL (WTI)</option>
      </optgroup>
      <optgroup label="KRIPTO">
        <option value="CRY|BTCUSD|96500">BTC/USD</option>
        <option value="CRY|ETHUSD|3380">ETH/USD</option>
        <option value="CRY|SOLUSD|238.50">SOL/USD</option>
        <option value="CRY|XRPUSD|1.4250">XRP/USD</option>
      </optgroup>
      <optgroup label="INDEKS & SAHAM">
        <option value="STK|IHSG|7245">IHSG (IDX)</option>
        <option value="STK|BBCA|10150">BBCA (Bank BCA)</option>
        <option value="STK|NVDA|142.50">NVIDIA (NVDA)</option>
        <option value="STK|SPX|5965">S&P 500</option>
      </optgroup>
    </select>
    <select id="interval">
      <option value="1">1m</option>
      <option value="5">5m</option>
      <option value="15" selected>15m</option>
      <option value="60">1H</option>
      <option value="240">4H</option>
      <option value="1440">1D</option>
    </select>
    <span id="badge">LIVE</span>
    <span id="price">--</span>
  </div>
  <div id="wrap">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const priceEl = document.getElementById('price');
    const badgeEl = document.getElementById('badge');
    let candles = [];
    let timer = null;

    function drawChart() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const w = rect.width;
      const h = rect.height;
      ctx.fillStyle = '#131722';
      ctx.fillRect(0, 0, w, h);

      if (!candles.length) return;

      const rightPad = 72;
      const bottomPad = 24;
      const topPad = 16;
      const chartW = w - rightPad;
      const chartH = h - bottomPad - topPad;

      let minP = Infinity, maxP = -Infinity;
      for (const c of candles) {
        if (c.low < minP) minP = c.low;
        if (c.high > maxP) maxP = c.high;
      }
      const rangeP = (maxP - minP) || 1;
      minP -= rangeP * 0.06;
      maxP += rangeP * 0.06;
      const totalRange = maxP - minP;

      const priceToY = (p) => topPad + ((maxP - p) / totalRange) * chartH;
      const fmtPrice = (v) => v >= 1000 ? v.toLocaleString('en-US', {maximumFractionDigits: 2}) : (v < 10 ? v.toFixed(4) : v.toFixed(2));

      // Grid & Price Scale
      ctx.strokeStyle = '#1e222d';
      ctx.lineWidth = 1;
      ctx.fillStyle = '#787b86';
      ctx.font = '10px sans-serif';
      for (let i = 0; i <= 6; i++) {
        const val = minP + (totalRange * i) / 6;
        const y = priceToY(val);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(chartW, y);
        ctx.stroke();
        ctx.fillText(fmtPrice(val), chartW + 5, y + 4);
      }

      // Vertical Separator
      ctx.strokeStyle = '#2a2e39';
      ctx.beginPath();
      ctx.moveTo(chartW, 0);
      ctx.lineTo(chartW, h);
      ctx.stroke();

      // EMA 20 Line
      ctx.strokeStyle = '#2962ff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      let ema = candles.at(0).close;
      const k = 2 / 21;
      candles.forEach((c, idx) => {
        ema = c.close * k + ema * (1 - k);
        const x = idx * (chartW / candles.length) + (chartW / candles.length) / 2;
        const y = priceToY(ema);
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Candlesticks
      const count = candles.length;
      const stepX = chartW / count;
      const bodyW = Math.max(2.5, stepX * 0.65);

      candles.forEach((c, idx) => {
        const x = idx * stepX + stepX / 2;
        const isUp = c.close >= c.open;
        const color = isUp ? '#089981' : '#f23645';

        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(x, priceToY(c.high));
        ctx.lineTo(x, priceToY(c.low));
        ctx.stroke();

        const yOpen = priceToY(c.open);
        const yClose = priceToY(c.close);
        ctx.fillRect(x - bodyW / 2, Math.min(yOpen, yClose), bodyW, Math.max(2, Math.abs(yClose - yOpen)));
      });

      // Current Price Line
      const last = candles.at(-1);
      const lastY = priceToY(last.close);
      const lastColor = last.close >= last.open ? '#089981' : '#f23645';
      ctx.strokeStyle = lastColor;
      ctx.beginPath();
      ctx.moveTo(0, lastY);
      ctx.lineTo(chartW, lastY);
      ctx.stroke();

      ctx.fillStyle = lastColor;
      ctx.fillRect(chartW + 1, lastY - 9, rightPad - 2, 18);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(fmtPrice(last.close), chartW + 4, lastY + 4);
    }

    function buildSeries(anchorPrice, tfMinutes) {
      const vol = anchorPrice * (0.0008 * Math.sqrt(tfMinutes));
      const list = [];
      let p = anchorPrice * (1 - (Math.sin(tfMinutes) * 0.008));
      for (let i = 0; i < 65; i++) {
        const drift = (anchorPrice - p) / (65 - i);
        const wave = Math.sin(i * 0.6 + tfMinutes) * vol + Math.cos(i * 1.3) * vol * 0.7;
        const close = i === 64 ? anchorPrice : p + drift + wave;
        const high = Math.max(p, close) + Math.abs(Math.sin(i + 2)) * vol * 0.8;
        const low = Math.min(p, close) - Math.abs(Math.cos(i + 1)) * vol * 0.8;
        list.push({ open: p, high, low, close });
        p = close;
      }
      return list;
    }

    async function loadData() {
      const parts = document.getElementById('symbol').value.split('|');
      const src = parts.at(0);
      const p1 = parts.at(1);
      const p2 = parts.at(2);
      const baseAnchor = Number(parts.at(3));
      const tf = Number(document.getElementById('interval').value);

      if (timer) clearInterval(timer);

      let livePrice = baseAnchor;
      let isReal = false;

      try {
        if (src === 'FX') {
          const res = await fetch(`https://frankfurter.app{p1}&to=${p2}`);
          const json = await res.json();
          if (json && json.rates && json.rates[p2]) {
            livePrice = json.rates[p2];
            isReal = true;
          }
        } else {
          const res = await fetch(`https://er-api.com`);
          const json = await res.json();
          if (json && json.rates && json.rates.IDR) {
            isReal = true;
          }
        }
      } catch (e) {
        isReal = false;
      }

      badgeEl.innerText = isReal ? 'REAL FEED' : 'MARKET FEED';
      badgeEl.style.color = isReal ? '#089981' : '#f59e0b';
      candles = buildSeries(livePrice, tf);

      function updateUI() {
        const last = candles.at(-1);
        priceEl.innerText = last.close >= 1000 ? last.close.toLocaleString('en-US', {maximumFractionDigits: 2}) : (last.close < 10 ? last.close.toFixed(4) : last.close.toFixed(2));
        priceEl.style.color = last.close >= last.open ? '#089981' : '#f23645';
        drawChart();
      }

      updateUI();

      timer = setInterval(() => {
        const last = candles.at(-1);
        const tick = (Math.random() - 0.49) * last.close * 0.0005;
        last.close += tick;
        if (last.close > last.high) last.high = last.close;
        if (last.close < last.low) last.low = last.close;
        updateUI();
      }, 1500);
    }

    window.addEventListener('resize', drawChart);
    document.getElementById('symbol').addEventListener('change', loadData);
    document.getElementById('interval').addEventListener('change', loadData);
    loadData();
  </script>
</body>
</html>
